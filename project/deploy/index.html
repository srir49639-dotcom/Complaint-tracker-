<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROCV-AI 2026 - Robotics, Communication, VLSI, and Artificial Intelligence</title>
<meta name="description" content="International Conference on Emerging Trends in Robotics, Communication, VLSI, and Artificial Intelligence (ROCV-AI 2026) - May 15-16, 2026 at KLEF Bowrampet Campus, Hyderabad">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0a1729;
  --deep:#12294a;
  --deep-2:#1b3a63;
  --gold:#e0a419;
  --gold-soft:#f6c65b;
  --sky:#2b7fc4;
  --paper:#f6f8fb;
  --white:#ffffff;
  --line:#dfe6ef;
  --text:#1f2a3a;
  --muted:#5b6b7f;
  --radius:14px;
  --maxw:1180px;
  --shadow:0 10px 30px rgba(10,23,41,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--text);background:var(--white);line-height:1.65;font-size:16px;
}
h1,h2,h3,h4,h5{font-family:'Sora','Segoe UI',system-ui,sans-serif;line-height:1.2;margin:0 0 .5em;color:var(--ink);font-weight:700}
h1{font-size:clamp(2rem,5vw,3.2rem)}
h2{font-size:clamp(1.5rem,3.2vw,2.25rem)}
h3{font-size:1.25rem}
h4{font-size:1.05rem}
p{margin:0 0 1rem}
a{color:var(--sky);text-decoration:none}
a:hover{text-decoration:underline}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}
.section{padding:72px 0}
.section.alt{background:var(--paper)}
.eyebrow{font-family:'Sora','Segoe UI',system-ui,sans-serif;font-size:.82rem;font-weight:600;color:var(--gold);letter-spacing:.08em;margin-bottom:.5rem}
.lead{font-size:1.05rem;color:var(--muted);max-width:70ch}
.center{text-align:center}
.center .lead{margin-left:auto;margin-right:auto}

/* ---------- header ---------- */
header.site{position:sticky;top:0;z-index:60;background:rgba(10,23,41,.97);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.08)}
.navbar{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:var(--maxw);margin:0 auto;padding:12px 20px}
.brand{font-family:'Sora','Segoe UI',system-ui,sans-serif;font-weight:800;font-size:1.15rem;color:#fff;letter-spacing:.02em}
.brand:hover{text-decoration:none;color:var(--gold-soft)}
.brand small{display:block;font-family:'Inter';font-size:.66rem;font-weight:500;color:#93a7c0;letter-spacing:.04em}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav a{color:#cfdcec;font-size:.88rem;font-weight:500;padding:8px 11px;border-radius:8px}
.nav a:hover{background:rgba(255,255,255,.09);color:#fff;text-decoration:none}
.nav a.active{color:var(--ink);background:var(--gold);font-weight:600}
.burger{display:none;background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:7px 11px;font-size:1.1rem;cursor:pointer}

/* ---------- hero ---------- */
.hero{position:relative;background:linear-gradient(135deg,var(--ink) 0%,var(--deep) 55%,var(--deep-2) 100%);color:#fff;overflow:hidden;padding:88px 0 76px}
.hero:before{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 82% 18%,rgba(224,164,25,.20),transparent 45%),
  radial-gradient(circle at 12% 88%,rgba(43,127,196,.28),transparent 48%);}
.hero .wrap{position:relative}
.hero h1{color:#fff;font-size:clamp(2.4rem,6.5vw,4.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:.35em}
.hero .eyebrow{color:var(--gold-soft)}
.hero-sub{font-size:clamp(1rem,2vw,1.3rem);color:#d3e0ef;max-width:44ch;margin-bottom:2rem}
.hero-facts{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:2rem}
.fact{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:14px 20px;min-width:210px}
.fact span{display:block;font-size:.74rem;color:#9fb4cc;font-weight:600;letter-spacing:.06em;margin-bottom:2px}
.fact strong{font-family:'Sora','Segoe UI',system-ui,sans-serif;font-size:1.08rem;color:#fff;font-weight:600}
.icon-strip{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:26px;opacity:.85}
.icon-strip svg{width:32px;height:32px;color:var(--gold-soft);opacity:.85}
[data-go]{cursor:pointer}
a[data-go]{color:var(--sky)}
a[data-go]:hover{text-decoration:underline}
.nav a[data-go],.brand[data-go],.btn[data-go],.foot-links a[data-go]{text-decoration:none}
.btn{display:inline-block;font-family:'Sora','Segoe UI',system-ui,sans-serif;font-weight:600;font-size:.95rem;padding:13px 26px;border-radius:10px;border:1.5px solid transparent;cursor:pointer;transition:transform .15s ease,background .15s ease}
.btn:hover{text-decoration:none;transform:translateY(-1px)}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-gold:hover{background:var(--gold-soft);color:var(--ink)}
.btn-ghost{border-color:rgba(255,255,255,.5);color:#fff}
.btn-ghost:hover{background:rgba(255,255,255,.12);color:#fff}
.btn-dark{background:var(--deep);color:#fff}
.btn-dark:hover{background:var(--deep-2);color:#fff}
.btn-row{display:flex;gap:14px;flex-wrap:wrap}

/* ---------- page banner ---------- */
.banner{background:linear-gradient(135deg,var(--ink),var(--deep-2));color:#fff;padding:60px 0 52px}
.banner h1{color:#fff;margin-bottom:.25em}
.banner p{color:#c9d8e9;max-width:70ch;margin:0}
.banner .eyebrow{color:var(--gold-soft)}

/* ---------- generic blocks ---------- */
.grid{display:grid;gap:24px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.split{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow)}
.card h3{margin-bottom:.4em}
.card p:last-child{margin-bottom:0}
.media{border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);position:relative}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.media-cap{position:absolute;left:0;right:0;bottom:0;padding:22px;background:linear-gradient(transparent,rgba(10,23,41,.9));color:#fff}
.media-cap h4{color:#fff;margin:0 0 2px}
.media-cap span{font-size:.85rem;color:#cddaea}

.topic-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.topic-card img{width:100%;height:168px;object-fit:cover}
.topic-card .body{padding:20px}
.topic-card h3{font-size:1.1rem}
.topic-card p{margin:0;font-size:.93rem;color:var(--muted)}

/* ---------- timeline / dates ---------- */
.dates-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px}
.date-card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:22px 24px;box-shadow:var(--shadow)}
.date-card h4{margin:0 0 6px;font-size:1rem}
.date-card .d{font-family:'Sora','Segoe UI',system-ui,sans-serif;font-size:1.35rem;font-weight:700;color:var(--deep);margin-bottom:8px}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.03em}
.pill.active{background:#e5f5ec;color:#186c3c}
.pill.scheduled{background:#e8f0fb;color:#1a4d8f}
.pill.passed{background:#fdeceb;color:#a3271f}
.notice{background:#fff8e6;border:1px solid #f2dda0;border-left:4px solid var(--gold);border-radius:12px;padding:20px 24px;margin-bottom:34px}
.notice h4{margin-bottom:.3em}
.notice p{margin:0;color:#6b5a2b}

/* ---------- lists ---------- */
ul.clean{list-style:none;padding:0;margin:0}
ul.clean li{position:relative;padding:9px 0 9px 26px;border-bottom:1px solid var(--line)}
ul.clean li:last-child{border-bottom:none}
ul.clean li:before{content:"";position:absolute;left:4px;top:18px;width:8px;height:8px;border-radius:2px;background:var(--gold)}
ol.steps{counter-reset:s;list-style:none;padding:0;margin:0}
ol.steps li{counter-increment:s;position:relative;padding:10px 0 10px 46px}
ol.steps li:before{content:counter(s);position:absolute;left:0;top:9px;width:30px;height:30px;border-radius:50%;background:var(--deep);color:#fff;font-family:'Sora';font-weight:700;font-size:.85rem;display:grid;place-items:center}

/* ---------- tracks ---------- */
.track{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;background:#fff;overflow:hidden}
.track button{width:100%;text-align:left;background:#fff;border:0;padding:16px 20px;font-family:'Sora';font-weight:600;font-size:1rem;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;gap:14px;align-items:center}
.track button:hover{background:var(--paper)}
.track .count{font-family:'Inter';font-size:.78rem;font-weight:600;color:var(--muted);background:var(--paper);border:1px solid var(--line);padding:3px 9px;border-radius:999px;white-space:nowrap}
.track .panel{display:none;padding:0 20px 18px;border-top:1px solid var(--line)}
.track.open .panel{display:block}
.track.open button .chev{transform:rotate(180deg)}
.chev{transition:transform .2s ease;color:var(--gold);font-size:.8rem}

/* ---------- committee ---------- */
.comm-group{margin-bottom:38px}
.comm-group h3{display:flex;align-items:center;gap:12px;padding-bottom:10px;border-bottom:2px solid var(--gold)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:18px}
.person{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 18px}
.person b{display:block;font-family:'Sora';font-size:.98rem;color:var(--ink)}
.person span{font-size:.86rem;color:var(--muted)}

/* ---------- fees ---------- */
.fee-table{width:100%;border-collapse:collapse;margin-top:6px}
.fee-table td{padding:11px 0;border-bottom:1px dashed var(--line);font-size:.95rem}
.fee-table td:last-child{text-align:right;font-family:'Sora';font-weight:600;color:var(--deep);white-space:nowrap}
.fee-table tr:last-child td{border-bottom:none}
.badge{display:inline-block;background:var(--gold);color:var(--ink);font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:999px;margin-left:8px;vertical-align:middle}
.kv{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:.94rem}
.kv:last-child{border-bottom:none}
.kv b{font-family:'Sora';color:var(--deep)}
.faq{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px;overflow:hidden}
.faq button{width:100%;text-align:left;background:#fff;border:0;padding:16px 20px;font-family:'Sora';font-weight:600;font-size:.98rem;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;gap:12px}
.faq .panel{display:none;padding:0 20px 16px;color:var(--muted);font-size:.94rem}
.faq.open .panel{display:block}
.faq.open .chev{transform:rotate(180deg)}
.small-note{font-size:.86rem;color:var(--muted);margin:6px 0}

/* ---------- footer ---------- */
footer.site{background:var(--ink);color:#b9c9dc;padding:52px 0 26px;font-size:.92rem}
footer.site h4{color:#fff;font-size:1rem;margin-bottom:.9em}
footer.site a{color:#b9c9dc}
footer.site a:hover{color:var(--gold-soft)}
.foot-grid{display:grid;grid-template-columns:1.6fr 1fr 1.2fr;gap:36px}
.foot-links{list-style:none;padding:0;margin:0}
.foot-links li{margin-bottom:7px}
.foot-bottom{border-top:1px solid rgba(255,255,255,.12);margin-top:34px;padding-top:20px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:.85rem;color:#8ba0b8}
.edit-link{background:none;border:1px solid rgba(255,255,255,.22);color:#8ba0b8;font:inherit;font-size:.82rem;padding:5px 12px;border-radius:8px;cursor:pointer}
.edit-link:hover{color:#fff;border-color:var(--gold)}

/* ---------- admin ---------- */
#admin{position:fixed;inset:0 0 0 auto;width:min(560px,100%);background:#fff;box-shadow:-14px 0 44px rgba(10,23,41,.25);z-index:200;display:none;flex-direction:column}
#admin.open{display:flex}
.adm-head{background:var(--ink);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.adm-head h3{color:#fff;margin:0;font-size:1.05rem}
.adm-head button{background:rgba(255,255,255,.12);border:0;color:#fff;font-size:1.1rem;width:32px;height:32px;border-radius:8px;cursor:pointer}
.adm-tabs{display:flex;flex-wrap:wrap;gap:4px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--paper)}
.adm-tabs button{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.8rem;font-family:'Inter';cursor:pointer;color:var(--muted)}
.adm-tabs button.on{background:var(--deep);border-color:var(--deep);color:#fff;font-weight:600}
.adm-body{flex:1;overflow-y:auto;padding:18px 20px 40px}
.adm-foot{border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--paper)}
.fld{margin-bottom:16px}
.fld label{display:block;font-size:.78rem;font-weight:700;color:var(--deep);margin-bottom:5px;font-family:'Sora'}
.fld input,.fld textarea,.fld select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:.9rem;background:#fff;color:var(--text)}
.fld textarea{min-height:82px;resize:vertical;line-height:1.5}
.fld input:focus,.fld textarea:focus{border-color:var(--sky);outline:none;box-shadow:0 0 0 3px rgba(43,127,196,.15)}
.rowbox{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;background:var(--paper)}
.rowbox .rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.rowbox .rh b{font-family:'Sora';font-size:.85rem;color:var(--deep)}
.mini{background:#fff;border:1px solid var(--line);border-radius:7px;padding:3px 9px;font-size:.76rem;cursor:pointer;color:var(--muted);margin-left:4px}
.mini:hover{border-color:var(--sky);color:var(--sky)}
.mini.danger:hover{border-color:#c0392b;color:#c0392b}
.adm-note{font-size:.82rem;color:var(--muted);background:#fff8e6;border:1px solid #f2dda0;border-radius:8px;padding:10px 12px;margin-bottom:16px}
#admScrim{position:fixed;inset:0;background:rgba(10,23,41,.4);z-index:190;display:none}
#admScrim.open{display:block}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;z-index:300;font-size:.9rem;display:none}
.toast.show{display:block}

@media(max-width:900px){
  .split{grid-template-columns:1fr;gap:26px}
  .g3,.g4{grid-template-columns:repeat(2,1fr)}
  .foot-grid{grid-template-columns:1fr;gap:26px}
}
@media(max-width:720px){
  .burger{display:block}
  .nav{display:none;width:100%;flex-direction:column;padding:8px 0 12px}
  .nav.open{display:flex}
  .navbar{flex-wrap:wrap}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .section{padding:52px 0}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  var t=(s||'').toLowerCase(), c='scheduled';
  if(t.indexOf('active')>-1) c='active';
  else if(t.indexOf('pass')>-1||t.indexOf('closed')>-1) c='passed';
  return '<span class="pill '+c+'">'+esc(s)+'</span>';
}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.className='toast show';setTimeout(function(){t.className='toast';},2200);}

var ROUTES = {
  '': pageHome, 'home': pageHome, 'about': pageAbout, 'call-for-papers': pageCfp,
  'important-dates': pageDates, 'speakers': pageSpeakers, 'committee': pageCommittee,
  'venue': pageVenue, 'registration': pageRegistration, 'sponsorship': pageSponsorship
};

var CURRENT = 'home';
function go(path){
  CURRENT = (path && ROUTES[path]) ? path : 'home';
  try{ history.replaceState(null,'','#/'+(CURRENT==='home'?'':CURRENT)); }catch(e){}
  document.getElementById('nav').classList.remove('open');
  render(false);
}
document.addEventListener('click', function(e){
  var a = e.target.closest ? e.target.closest('[data-go]') : null;
  if(!a) return;
  e.preventDefault(); e.stopPropagation();
  go(a.getAttribute('data-go'));
});
document.addEventListener('keydown', function(e){
  if(e.key!=='Enter' && e.key!==' ') return;
  var a = e.target.closest ? e.target.closest('[data-go]') : null;
  if(!a) return;
  e.preventDefault(); go(a.getAttribute('data-go'));
});
function render(keepScroll){
  var y = window.scrollY;
  var key = CURRENT;
  var fn = ROUTES[key] || pageHome;
  document.getElementById('app').innerHTML = fn();
  renderChrome();
  document.querySelectorAll('[data-acc] button').forEach(function(b){
    b.onclick = function(){ b.parentElement.classList.toggle('open'); };
  });
  document.getElementById('burger').onclick = function(){ document.getElementById('nav').classList.toggle('open'); };
  document.title = (key? (D.nav.filter(function(n){return n.path===key;})[0]||{label:'Home'}).label+' | ' : '') + D.meta.shortName;
  if(keepScroll) window.scrollTo(0,y); else window.scrollTo(0,0);
}

var activeTab = 'General';

function field(def, val, onChange){
  var w=document.createElement('div'); w.className='fld';
  if(def.l){ var lb=document.createElement('label'); lb.textContent=def.l; w.appendChild(lb); }
  var el;
  if(def.t==='select'){
    el=document.createElement('select');
    (def.o||[]).forEach(function(o){var op=document.createElement('option');op.value=o;op.textContent=o;el.appendChild(op);});
    el.value=val||'';
  } else if(def.t==='area'||def.t==='list'||def.t==='pairs'){
    el=document.createElement('textarea');
    if(def.t==='list') el.value=(val||[]).join('\n');
    else if(def.t==='pairs') el.value=(val||[]).map(function(o){return o[def.keys[0]]+' | '+o[def.keys[1]];}).join('\n');
    else el.value=val||'';
    if(def.t!=='area') el.style.minHeight='120px';
  } else {
    el=document.createElement('input'); el.type='text'; el.value=val==null?'':val;
  }
  el.oninput=el.onchange=function(){
    var v=el.value;
    if(def.t==='list') v=v.split('\n').map(function(s){return s.trim();}).filter(function(s){return s.length;});
    if(def.t==='pairs') v=v.split('\n').filter(function(s){return s.trim().length;}).map(function(s){
      var parts=s.split('|'); var o={}; o[def.keys[0]]=(parts[0]||'').trim(); o[def.keys[1]]=(parts.slice(1).join('|')||'').trim(); return o;
    });
    onChange(v); render(true);
  };
  w.appendChild(el); return w;
}

function objsEditor(def){
  var box=document.createElement('div');
  var lab=document.createElement('label'); lab.style.cssText='display:block;font-size:.78rem;font-weight:700;color:var(--deep);margin-bottom:8px;font-family:Sora';
  lab.textContent=def.l; box.appendChild(lab);
  var arr=get(def.p)||[];
  arr.forEach(function(item,i){
    var rb=document.createElement('div'); rb.className='rowbox';
    var rh=document.createElement('div'); rh.className='rh';
    rh.innerHTML='<b>#'+(i+1)+'</b>';
    var ctr=document.createElement('div');
    ['\u2191','\u2193','Remove'].forEach(function(t,k){
      var b=document.createElement('button'); b.className='mini'+(k===2?' danger':''); b.textContent=t;
      b.onclick=function(){
        if(k===0&&i>0){ arr.splice(i-1,0,arr.splice(i,1)[0]); }
        else if(k===1&&i<arr.length-1){ arr.splice(i+1,0,arr.splice(i,1)[0]); }
        else if(k===2){ if(confirm('Remove this entry?')) arr.splice(i,1); else return; }
        buildBody(); render(true);
      };
      ctr.appendChild(b);
    });
    rh.appendChild(ctr); rb.appendChild(rh);
    def.f.forEach(function(fd){
      rb.appendChild(field(fd, item[fd.k], function(v){ item[fd.k]=v; }));
    });
    box.appendChild(rb);
  });
  var add=document.createElement('button'); add.className='mini'; add.textContent='+ Add entry';
  add.onclick=function(){ arr.push(JSON.parse(JSON.stringify(def.tpl))); buildBody(); render(true); };
  box.appendChild(add);
  return box;
}

function groupsEditor(def){
  var box=document.createElement('div'); var arr=get(def.p)||[];
  var lab=document.createElement('label'); lab.style.cssText='display:block;font-size:.78rem;font-weight:700;color:var(--deep);margin-bottom:8px;font-family:Sora';
  lab.textContent=def.l; box.appendChild(lab);
  arr.forEach(function(g,i){
    var rb=document.createElement('div'); rb.className='rowbox';
    var rh=document.createElement('div'); rh.className='rh'; rh.innerHTML='<b>'+esc(g.name||('Group '+(i+1)))+'</b>';
    var ctr=document.createElement('div');
    ['\u2191','\u2193','Remove'].forEach(function(t,k){
      var b=document.createElement('button'); b.className='mini'+(k===2?' danger':''); b.textContent=t;
      b.onclick=function(){
        if(k===0&&i>0) arr.splice(i-1,0,arr.splice(i,1)[0]);
        else if(k===1&&i<arr.length-1) arr.splice(i+1,0,arr.splice(i,1)[0]);
        else if(k===2){ if(confirm('Remove "'+(g.name||'')+'" and all its members?')) arr.splice(i,1); else return; }
        buildBody(); render(true);
      };
      ctr.appendChild(b);
    });
    rh.appendChild(ctr); rb.appendChild(rh);
    rb.appendChild(field({l:'Group name',t:'text'}, g.name, function(v){ g.name=v; }));
    rb.appendChild(field({l:'Members — one per line as: Name | Designation',t:'pairs',keys:['name','role']}, g.members, function(v){ g.members=v; }));
    box.appendChild(rb);
  });
  var add=document.createElement('button'); add.className='mini'; add.textContent='+ Add group';
  add.onclick=function(){ arr.push({name:'New group',members:[]}); buildBody(); render(true); };
  box.appendChild(add);
  return box;
}

function buildBody(){
  var body=document.getElementById('admBody'); body.innerHTML='';
  var note=document.createElement('div'); note.className='adm-note';
  note.textContent='Edits update the page instantly but live only in this browser tab. Click "Download updated site" and replace your index.html to publish them.';
  body.appendChild(note);
  (SCHEMA[activeTab]||[]).forEach(function(def){
    if(def.t==='raw'){
      var w=document.createElement('div'); w.className='fld';
      var lb=document.createElement('label'); lb.textContent='All content as JSON (advanced)'; w.appendChild(lb);
      var ta=document.createElement('textarea'); ta.style.minHeight='420px'; ta.style.fontFamily='ui-monospace,Menlo,monospace'; ta.style.fontSize='.78rem';
      ta.value=JSON.stringify(D,null,2); w.appendChild(ta);
      var b=document.createElement('button'); b.className='mini'; b.textContent='Apply JSON';
      b.onclick=function(){
        try{ var o=JSON.parse(ta.value); Object.keys(D).forEach(function(k){delete D[k];}); Object.keys(o).forEach(function(k){D[k]=o[k];}); render(true); buildBody(); toast('JSON applied'); }
        catch(e){ alert('That is not valid JSON: '+e.message); }
      };
      w.appendChild(b); body.appendChild(w); return;
    }
    if(def.t==='objs'){ body.appendChild(objsEditor(def)); return; }
    if(def.t==='groups'){ body.appendChild(groupsEditor(def)); return; }
    body.appendChild(field(def, get(def.p), function(v){ set(def.p,v); }));
  });
}

function buildTabs(){
  var t=document.getElementById('admTabs'); t.innerHTML='';
  Object.keys(SCHEMA).forEach(function(name){
    var b=document.createElement('button'); b.textContent=name;
    if(name===activeTab) b.className='on';
    b.onclick=function(){ activeTab=name; buildTabs(); buildBody(); document.getElementById('admBody').scrollTop=0; };
    t.appendChild(b);
  });
}

var unlocked=false;
function openAdmin(){
  if(!unlocked){
    var p=prompt('Enter the editor password:');
    if(p===null) return;
    if(p!==D.admin.password){ alert('Wrong password.'); return; }
    unlocked=true;
  }
  document.getElementById('admin').classList.add('open');
  document.getElementById('admScrim').classList.add('open');
  buildTabs(); buildBody();
}
function closeAdmin(){
  document.getElementById('admin').classList.remove('open');
  document.getElementById('admScrim').classList.remove('open');
}
document.getElementById('admClose').onclick=closeAdmin;
document.getElementById('admScrim').onclick=closeAdmin;
document.addEventListener('keydown',function(e){
  if(e.key==='Escape') closeAdmin();
  if(e.ctrlKey&&e.shiftKey&&(e.key==='E'||e.key==='e')){ e.preventDefault(); openAdmin(); }
});

document.getElementById('admJson').onclick=function(){
  var txt=JSON.stringify(D,null,2);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){toast('Content copied as JSON');},function(){window.prompt('Copy this JSON:',txt);});
  } else window.prompt('Copy this JSON:',txt);
};

document.getElementById('admSave').onclick=function(){
  var marker='<script id="site-data" type="application/json">';
  var i=ORIGINAL_HTML.indexOf(marker);
  if(i<0){ alert('Could not locate the content block.'); return; }
  var open=i+marker.length;
  var close=ORIGINAL_HTML.indexOf('<'+'/script>',open);
  var out=ORIGINAL_HTML.slice(0,open)+'\n'+JSON.stringify(D,null,2)+'\n'+ORIGINAL_HTML.slice(close);
  var blob=new Blob([out],{type:'text/html'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='index.html';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href);},1500);
  toast('index.html downloaded — upload it to replace your site');
};
